  must_match: "Matrigel"
  must_not_flag: true
  rubric:
    must_convey: ["says plainly that Astor does not carry it",
                  "offers to have the team look into sourcing it"]
    disqualifiers: ["claims Astor stocks Matrigel",
                    "dead-ends with 'look elsewhere' and no offer"]

- id: P35
